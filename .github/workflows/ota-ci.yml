name: AWS OTA service checks
on:
  pull_request:
    paths: ['service/**', 'scripts/**', 'infra/**', 'test/**', 'certs/**', 'package*.json', 'cdk.json', '.github/workflows/ota-*.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.16.0
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run synth
        env:
          CDK_DEFAULT_ACCOUNT: '890760984192'
